<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm p-4">
        <h2 class="fw-bold mb-4">Edit Page</h2>
        <form th:action="@{/pages/edit/{id}(id=${page.id})}" method="post">
            <div class="mb-3">
                <input type="text" name="title" class="form-control form-control-lg" th:value="${page.title}"/>
            </div>
            <div class="mb-3">
                <textarea name="content" class="form-control" rows="8" th:text="${page.content}"></textarea>
            </div>
            <button type="submit" class="btn btn-dark">Update Page</button>
            <a href="/pages" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
