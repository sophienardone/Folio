<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>New Workspace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow-sm p-4">
    <h2 class="fw-bold mb-4">New Workspace</h2>
    <form action="/workspaces" method="post">
      <div class="mb-3">
        <input type="text" name="name" class="form-control form-control-lg" placeholder="Workspace name"/>
      </div>
      <button type="submit" class="btn btn-dark">Save Workspace</button>
      <a href="/workspaces" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
</body>
</html>
