<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${page.title}">Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<!--<body class="bg-light">-->
<!--<div class="container mt-5">-->
<body class="bg-light">
<div class="d-flex">


    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-grow-1 p-5">
    <a href="/pages" class="btn btn-outline-secondary mb-4">← Back</a>
    <div class="card shadow-sm p-4 mb-4">
        <h1 class="fw-bold" th:text="${page.title}"></h1>
        <p class="text-muted" th:text="${page.content}"></p>
    </div>


    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold">Sub Pages</h5>
        <a th:href="@{/pages/{id}/new(id=${page.id})}" class="btn btn-sm btn-dark">+ Add Sub Page</a>
    </div>
    <div class="list-group mb-4">
        <div th:each="subPage : ${page.subPages}" class="list-group-item">
            <a th:href="@{/pages/{id}(id=${subPage.id})}" th:text="${subPage.title}" class="text-decoration-none text-dark fw-semibold"></a>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(page.subPages)}" class="text-muted mb-4">No sub pages yet.</p>



        <h5 class="fw-bold mb-3">Blocks</h5>
        <div th:each="block : ${blocks}" class="mb-3">
            <div class="d-flex justify-content-between align-items-start">

                <h3 th:if="${block.type == 'heading'}" th:text="${block.content}" class="fw-bold"></h3>


                <ul th:if="${block.type == 'bullet'}" class="mb-0">
                    <li th:text="${block.content}"></li>
                </ul>

                <p th:if="${block.type == 'text'}" th:text="${block.content}" class="mb-0"></p>

                <a th:href="@{/blocks/delete/{id}/{pageId}(id=${block.id}, pageId=${page.id})}" class="btn btn-sm btn-outline-danger ms-3">Delete</a>
            </div>
        </div>

    <div class="card shadow-sm p-4 mt-4">
        <h6 class="fw-bold mb-3">Add Block</h6>
        <form th:action="@{/pages/{pageId}/blocks(pageId=${page.id})}" method="post">
            <div class="mb-3">
                <select name="type" class="form-select">
                    <option value="text">Text</option>
                    <option value="heading">Heading</option>
                    <option value="bullet">Bullet</option>
                </select>
            </div>
            <div class="mb-3">
                <textarea name="content" class="form-control" rows="3" placeholder="Block content..."></textarea>
            </div>
            <button type="submit" class="btn btn-dark">Add Block</button>
        </form>
    </div>
    </div>
</div>
</body>
</html>
