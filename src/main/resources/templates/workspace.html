<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${workspace.name}">Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container mt-5">
    <a href="/workspaces" class="btn btn-outline-secondary mb-4">← Back</a>
    <div class="card shadow-sm p-4 mb-4">
        <h1 class="fw-bold" th:text="${workspace.name}"></h1>
    </div>
    <h5 class="fw-bold mb-3">Pages</h5>
    <div class="list-group">
        <div th:each="page : ${workspace.pages}" class="list-group-item d-flex justify-content-between align-items-center">
            <a th:href="@{/pages/{id}(id=${page.id})}" th:text="${page.title}" class="text-decoration-none text-dark fw-semibold"></a>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(workspace.pages)}" class="text-muted mt-3">No pages in this workspace yet.</p>
</div>
</body>
</html>
