<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Folio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="d-flex">


  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="flex-grow-1 p-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="fw-bold">My Pages</h1>
      <a href="/pages/new" class="btn btn-dark">+ New Page</a>
    </div>

    <form action="/pages/search" method="get" class="mb-4">
      <div class="input-group">
        <input type="text" name="keyword" class="form-control" placeholder="Search pages..." th:value="${keyword}"/>
        <button type="submit" class="btn btn-dark">Search</button>
      </div>
    </form>

    <div class="list-group">
      <div th:each="page : ${pages}" class="list-group-item d-flex justify-content-between align-items-center">
        <a th:href="@{/pages/{id}(id=${page.id})}" th:text="${page.title}" class="text-decoration-none text-dark fw-semibold"></a>
        <div>
          <a th:href="@{/pages/edit/{id}(id=${page.id})}" class="btn btn-sm btn-outline-secondary me-2">Edit</a>
          <a th:href="@{/pages/delete/{id}(id=${page.id})}" class="btn btn-sm btn-outline-danger">Delete</a>
        </div>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(pages)}" class="text-muted mt-3">No pages yet. Create one!</p>
  </div>
</div>
</body>
</html>
